name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm build

      - name: Upload dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-modules-${{ matrix.os }}
          path: node_modules
          if-no-files-found: error

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  test-unit:
    name: test / unit (${{ matrix.os }})
    needs:
      - build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-modules-${{ matrix.os }}
          path: node_modules

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-${{ matrix.os }}
          path: dist

      - name: Run unit tests
        run: corepack pnpm test

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.os }}
          path: coverage
          if-no-files-found: error

  test-markdownlint:
    name: test / markdownlint
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DavidAnson/markdownlint-cli2-action@fa0cd0f1a052f54da593c83860f2292982f5d142
        with:
          globs: |
            **/*.md
            !**/node_modules/**
          config: .markdownlint.json

  test-linkcheck:
    name: test / linkcheck
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --verbose './**/*.md'
          failIfEmpty: false

  package:
    name: package (${{ matrix.os }})
    needs:
      - test-unit
      - test-markdownlint
      - test-linkcheck
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-modules-${{ matrix.os }}
          path: node_modules

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-${{ matrix.os }}
          path: dist

      - name: Package dry run
        run: corepack pnpm pack:dry-run

  validate-catalog:
    name: verify / validate-catalog
    needs:
      - test-unit
      - test-markdownlint
      - test-linkcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-modules-ubuntu-latest
          path: node_modules

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-ubuntu-latest
          path: dist

      - name: Run catalog validation
        run: corepack pnpm validate

  quality-crap-ai-skills:
    name: verify / quality-crap-ai-skills
    needs:
      - test-unit
      - test-markdownlint
      - test-linkcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-modules-ubuntu-latest
          path: node_modules

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-ubuntu-latest
          path: dist

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-ubuntu-latest
          path: coverage

      - name: Run CRAP gate
        run: corepack pnpm quality:crap

  quality-cognitive-ai-skills:
    name: verify / quality-cognitive-ai-skills
    needs:
      - test-unit
      - test-markdownlint
      - test-linkcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-modules-ubuntu-latest
          path: node_modules

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist-ubuntu-latest
          path: dist

      - name: Run cognitive complexity gate
        run: corepack pnpm quality:cognitive
